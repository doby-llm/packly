name: packly-secret-export-temp
on:
  push:
    branches: [ir/packly-secret-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Encrypt the three values
        env:
          AGE_RECIPIENT: age19uw6myqwlj7hsu673edwql8z439f2308547xys2tetx923qxedqs09vt8u
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set +x
          umask 077
          mkdir -p out
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\n' "$KS_PW" "$KEY_PW" "$KEY_ALIAS" | age -r "$AGE_RECIPIENT" -o out/packly-secrets.age
          test -s out/packly-secrets.age
          echo "encrypted bytes: $(stat -c %s out/packly-secrets.age)"
      - uses: actions/upload-artifact@v4
        with:
          name: packly-secrets-age
          path: out/packly-secrets.age
          retention-days: 1
